const pzBanner=()=>storeOk(ME.id)?"":`<div class="errb"><b>Your Store Is Paused</b><br>${pzTxt(sto(ME.id).msg)}<br><span class="sm">Paused ${fd(sto(ME.id).since)}. New orders are blocked. Existing orders and payments continue as normal. Use Resume Store above to reopen.</span></div>`;

function pz1(){$("mdl").innerHTML=`<h2>Pause Your Store?</h2><p style="margin:10px 0 16px">Your store will temporarily stop accepting new orders. Your existing products, orders, payment records, and account will remain unchanged.</p><div class="btns"><button class="o" onclick="cl()">Cancel</button><button class="b" onclick="pz2()">Continue</button></div>`;$("ovl").classList.add("on")}
function pz2(m){$("mdl").innerHTML=`<h2>Why do you want to pause your store?</h2><div style="margin-top:10px">${fld("pz_m","Announcement for buyers",{ta:1,v:m,ph:"Our shop is busy with other work today, so we cannot process new orders. Please visit our shop directly to purchase. Thank you for understanding."})}</div><div class="er" id="pz_err" role="alert"></div><div class="btns" style="margin-top:8px"><button class="o" onclick="pz1()">Back</button><button class="b" id="pzb" onclick="pzGo()">Pause Store Now</button></div>`;$("ovl").classList.add("on")}
function pzGo(){if(!ME||ME.r!="owner")return;if(!chk([["pz_m",x=>x?x.length<=500?"":"Keep it under 500 characters":"Please enter a reason for buyers"]]))return;const raw=$("pz_m").value,oid=ME.id;sub("pzb",()=>{const ok=commit(()=>{const t=now();STORE[oid]={st:"paused",msg:raw,since:t,resumedAt:null};SH.push({id:"SP-"+(++SHN)+"-"+t.getTime(),oid,n:ME.n,msg:raw,pausedAt:t,resumedAt:null})});const e=$("pz_err");if(!ok){if(e)e.textContent="Could not save. Your store was not paused. Please try again.";return toast("Could not pause the store")}cl();notify("owner",oid,"Store paused","Your store is paused. New orders are blocked until you resume.",{v:"ord"});notify("admin",null,"Store paused",ME.n+" paused their store.",{v:"ahist",p:"store"});toast("Your store has been paused successfully.");pzBtn();go(V.v,"keep")})}
function pzR(){$("mdl").innerHTML=`<h2>Resume Your Store?</h2><p style="margin:10px 0 16px">Are you sure you want to reactivate your store and allow buyers to place new orders?</p><div class="er" id="pz_err" role="alert"></div><div class="btns"><button class="o" onclick="cl()">Cancel</button><button class="b" id="pzb" onclick="pzResume()">Resume Store</button></div>`;$("ovl").classList.add("on")}
function pzResume(){if(!ME||ME.r!="owner"||storeOk(ME.id))return;const oid=ME.id;sub("pzb",()=>{const ok=commit(()=>{const t=now();STORE[oid]={st:"active",msg:"",since:null,resumedAt:t};const ep=[...SH].reverse().find(e=>e.oid==oid&&!e.resumedAt);if(ep)ep.resumedAt=t});if(!ok){const e=$("pz_err");if(e)e.textContent="Could not save. Your store is still paused. Please try again.";return toast("Could not resume the store")}cl();notify("owner",oid,"Store active","Your store is active again.",{v:"ord"});notify("admin",null,"Store resumed",ME.n+" resumed their store.",{v:"ahist",p:"store"});toast("Your store is active again. Buyers can place new orders.");pzBtn();go(V.v,"keep")})}
/* buyer side */
function gate(p){if(!okP(p)){toast("This item is no longer available");return 0}if(!storeOk(p.oid)){toast("This Store Is Temporarily Paused. "+sto(p.oid).msg);return 0}return 1}
const card2=p=>{const h=card(p);return storeOk(p.oid)?h:h.replace(/<div class="fg" style="margin:6px 0 0">[\s\S]*$/,'<div class="sm" style="margin-top:8px"><b>Store paused.</b> Ordering is unavailable.</div></div></div>')};

const _vp=VW.products;VW.products=()=>_vp().replace('<div class="grid" id="pl">',owners().filter(o=>o.st=="Active"&&!storeOk(o.id)).map(o=>pzMsg(o.id)).join("")+'<div class="grid" id="pl">');
const _vc=VW.cart;VW.cart=()=>{const h=_vc(),os=[...new Set(Object.keys(C).map(PD).filter(p=>!storeOk(p.oid)).map(p=>p.oid))];if(!os.length)return h;return h.replace('<div class="pn">',os.map(pzMsg).join("")+'<p class="sm" style="margin-bottom:8px">Remove the items from paused stores to check out.</p><div class="pn">').replace('<button class="b" style="width:100%;margin-top:12px" onclick="CK=','<button class="b" disabled style="width:100%;margin-top:12px" onclick="CK=')};
/* admin */
function storeBlock(i){const s=sto(i),eps=SH.filter(e=>e.oid==i).sort((a,b)=>b.pausedAt-a.pausedAt);return`<div class="pn"><h2 style="margin-bottom:6px">Store status</h2><p>${pill(s.st=="paused"?"Paused":"Active")}${s.st=="paused"?`<br>${pzTxt(s.msg)}<br><span class="sm">Paused ${fd(s.since)}</span>`:s.resumedAt?`<br><span class="sm">Resumed ${fd(s.resumedAt)}</span>`:""}</p></div><h2 style="margin-bottom:8px">Pause and resume history</h2>`+tb(["Paused at","Announcement","Resumed at"],eps.map(e=>`<tr><td>${fd(e.pausedAt)}</td><td style="min-width:220px">${pzTxt(e.msg)}</td><td>${e.resumedAt?fd(e.resumedAt):"Still paused"}</td></tr>`))}

/* ===== v6: Packaged / Loose-Weighted form behaviour + payment-proof-first online payment ===== */
function setLab(id,t){const l=document.querySelector('label[for="'+id+'"]');if(l&&l.firstChild)l.firstChild.textContent=t+" "}
function ptUI(){const t=$("s_t").value,L=/^Loose/.test(t),P=t=="Packaged",u=$("s_u"),k=L?"L":P?"P":"O";if(u.dataset.k!=k){u.innerHTML=(L?["kg","g","L","ml"]:P?PKU:UALL).map(x=>`<option>${x}</option>`).join("");u.dataset.k=k}
$("pk_box").style.display=P?"":"none";
setLab("s_p",P?"Price per package (₹)":L?"Price per "+u.value+" (₹)":"Unit price (₹)");
setLab("s_s",P?"Available package quantity (stock)":L?"Available total quantity ("+u.value+")":"Available stock quantity");
setLab("s_u",P?"Package type":L?"Measurement unit":"Unit of measurement");
const s=$("s_s");s.dataset.n=L?"d":"i";s.setAttribute("inputmode",L?"decimal":"numeric");
$("pt_h").textContent=P?"Sold in fixed packages. Buyers choose how many packages they want.":L?"Sold by weight or volume. Buyers enter the quantity they need and pay price per "+u.value+" × quantity.":""}
AF.add=()=>{const t=$("s_t");if(!t)return;t.onchange=ptUI;$("s_u").onchange=ptUI;ptUI()};
let PSN=null;
const _vpay=VW.pay;VW.pay=()=>V.pid||!PSN?_vpay():PSV();
function PSV(){if(!CK.lines){PSN=null;return VW.orders()}const s=PSN.step||1;delete IMG.pn_img;return`<h1>Pay Now</h1><div class="two"><div class="pn"><h2>Payment QR</h2><p>Amount for your order</p><div class="kp" style="margin:8px 0">${kv("Exact amount",money(PSN.amt))}</div><div class="qr"></div><p class="sm" style="text-align:center">Pay to: ${PAYEE}. Preview placeholder: the real QR is generated for the verified recipient.</p></div><div class="pn">${s==1?`<h2 style="margin-bottom:8px">Ready to pay?</h2><p class="sm" style="margin-bottom:12px">Open your UPI app, scan the QR and pay exactly ${money(PSN.amt)}. Then come back to upload your proof.</p><div class="note" style="margin-bottom:12px">No order is created until you submit your UTR and payment screenshot.</div><button class="b" style="width:100%" onclick="PSN.step=2;go('pay','keep')">Proceed to Scan QR</button>`:`<h2 style="margin-bottom:10px">Upload payment proof</h2>${fld("pn_r","Transaction reference (UTR)",{ph:"From your UPI app"})}${fld("pn_img","Payment screenshot",{f:1})}<p class="sm" style="margin-bottom:10px">Status stays Payment Pending until the payment is verified. Uploading proof does not mark it paid.</p><button class="b" id="pnb" disabled style="width:100%" onclick="psSub()">Submit payment proof</button>`}<button class="o" style="width:100%;margin-top:8px" onclick="psBack()">Back to Order</button></div></div>`}
function psBack(){PSN=null;delete IMG.pn_img;if(CK.lines){CK.step="pay";CK.pm=null}go("co")}
function psSub(){if(LOCK)return;if(!PSN||!CK.lines)return toast("This payment session has ended. Please start again.");
const r=($("pn_r").value||"").trim(),er=$("e_pn_r"),ei=$("e_pn_img");er.textContent="";ei.textContent="";
if(!refOk(r)){er.textContent="Enter the 8–22 character UTR / reference";return}
if(!IMG.pn_img||!/^data:image\/(png|jpe?g|webp);base64,/.test(IMG.pn_img)||IMG.pn_img.length>2.8e6){ei.textContent="Upload a JPG or PNG screenshot (up to 2 MB)";return}
if(dupRef(r)){er.textContent="This reference was already submitted";return}
const e=chkL(CK.lines);if(e)return toast(e);
const t=totals(CK.lines);if(t.tot!=PSN.amt){PSN.amt=t.tot;PSN.step=1;toast("The amount changed to "+money(t.tot)+". Please pay the updated amount.");return go("pay","keep")}
LOCK=1;sub("pnb",()=>{if(!PSN||!CK.lines){LOCK=0;return}CK.pf={utr:r,img:IMG.pn_img};if(!mkOrders("on")){delete CK.pf;LOCK=0;return toast("This Store Is Temporarily Paused. New orders are not accepted.")}const ids=CK.ids.slice();PSN=null;delete IMG.pn_img;V.pid=ids[0];V.ps=1;CK={};LOCK=0;toast("Submitted. Awaiting verification. Not paid yet.");go("orders")})}
/* ===== Connected backend integration layer ===== */
let LIVE_ORDERS=[], LIVE_PAYMENTS=[], LIVE_SESSION=null;
function apiOrder(o){
  const a=o.address||{}; const items=(o.items||[]).map(i=>({pid:String(i.productId),n:i.name,q:1,pr:i.unitPrice,em:"📦",img:"",ty:i.type,u:i.unit,ps:"",qd:i.quantity,lineTotal:i.lineTotal}));
  const method=o.method==='cod'?'cod':'on';
  const pay=o.payStatus==='paid'?'Paid':o.payStatus==='verification_pending'?'Awaiting Verification':o.payStatus==='failed'?'Failed':'Pending';
  const st=o.status==='Delivered'?'Delivered':o.status==='Cancelled'?'Cancelled':o.status==='Awaiting Payment'?'Awaiting Payment':o.status==='Placed'?'Placed':'Awaiting Payment';
  return {id:String(o.id),bid:String(o.buyerId),oid:String(o.ownerId),lines:items,sub:o.subtotal,del:o.delivery,tot:o.total,pm:method,pay,st,cr:new Date(o.createdAt),addr:{n:a.name||'',m:a.mobile||'',e:'',a:a.address||'',c:a.city||'',s:'',p:a.pin||'',loc:[a.address,a.city,a.pin].filter(Boolean).join(', ')},hist:[],recvB:st==='Delivered',done:st==='Delivered'?new Date(o.createdAt):null,payStatus:o.payStatus,server:true};
}
async function refreshLiveOrders(){
  if(!ME)return; const r=await api('/api/orders'); LIVE_ORDERS=(r.orders||[]).map(apiOrder); OR=LIVE_ORDERS;
}
async function loadLiveData(){
  const result=ME.r==='owner'?await api('/api/my/products'):await api('/api/products');
  PR=(result.products||[]).map(uiProduct);
  if(ME.r==='admin'){
    try { const o=await api('/api/orders'); LIVE_ORDERS=(o.orders||[]).map(apiOrder); OR=LIVE_ORDERS; } catch(e) {}
  }
  if(V.v==='products'&&typeof drawP==='function')drawP();
}
const _enterAppConnected=enterApp;
async function enterApp(user){
  ME=uiUser(user); V={}; C={}; CK={};
  $('login').classList.add('hide'); ['top','app','bn'].forEach(i=>$(i).classList.remove('hide'));
  shell(); go(HOME[ME.r]);
  try { await loadLiveData(); await refreshLiveOrders(); if(ME.r==='buyer'&&V.v==='products')drawP(); if(VW[V.v])go(V.v,'keep'); }
  catch(e){toast('Signed in, but live data could not be loaded: '+e.message)}
}
const _goConnected=go;
go=function(v,p){_goConnected(v,p); if(!ME)return; if(['orders','history','ord','today','aord','ahist','ver','ov','owners','agraph'].includes(v)){(async()=>{try{await refreshLiveOrders();if(v==='ver')await renderLiveVerification();if(v==='orders'||v==='history'||v==='ord'||v==='aord'||v==='ahist')_goConnected(v,'keep')}catch(e){toast(e.message)}})();}};
function liveOrderCard(o,buyer){const address=o.addr||{};const items=(o.lines||[]).map(l=>`<div class="ln"><div class="im">📦</div><div class="n"><b>${esc(l.n)}</b><br><span class="sm">${esc(l.qd||l.q||'')} · ${money(l.pr||0)} each</span></div></div>`).join('');
 let actions='';
 if(buyer && o.st==='Placed') actions+=`<button class="b s" onclick="liveReceived('${o.id}')">Confirm received</button> `;
 if(buyer && ['Placed','Awaiting Payment'].includes(o.st)) actions+=`<button class="o s" onclick="liveCancel('${o.id}')">Cancel order</button> `;
 if(buyer && o.pm==='cod' && o.st==='Delivered' && o.pay!=='Paid') actions+=`<button class="b s" onclick="liveCashPaid('${o.id}')">Confirm cash paid</button>`;
 return `<div class="pn"><b>Order #${esc(o.id)}</b> ${pill(o.st)}<br><span class="sm">${fd(o.cr)} · ${o.pm==='cod'?'Cash on Delivery':'Online payment'} · Payment: ${esc(o.pay)}</span>${items}<p style="margin-top:8px"><b>Total ${money(o.tot)}</b></p><p class="sm">Delivery: ${esc(address.n||'')} ${esc(address.mobile||'')}<br>${esc(address.address||'')} ${esc(address.city||'')} ${esc(address.pin||'')}</p><div class="btns" style="flex-wrap:wrap">${actions}</div></div>`;
}
VW.orders=()=>{const l=LIVE_ORDERS.filter(o=>ME.r==='buyer'?o.bid===String(ME.id):ME.r==='owner'?o.oid===String(ME.id):true).filter(o=>!['Delivered','Cancelled'].includes(o.st)|| (o.pm==='cod'&&o.pay!=='Paid'));return `<h1>${ME.r==='owner'?'Orders received':ME.r==='admin'?'All orders':'My Orders'}</h1>${l.map(o=>liveOrderCard(o,ME.r==='buyer')).join('')||'<div class="empty pn">No active orders in the database.</div>'}`};
VW.history=()=>`<h1>Order History</h1>${LIVE_ORDERS.filter(o=>o.bid===String(ME.id)&&(['Delivered','Cancelled'].includes(o.st))).map(o=>liveOrderCard(o,true)).join('')||'<div class="empty pn">No completed orders yet.</div>'}`;
VW.ord=()=>VW.orders(); VW.aord=()=>VW.orders();
async function liveCancel(id){try{await api(`/api/orders/${encodeURIComponent(id)}/cancel`,{method:'POST',body:'{}'});await refreshLiveOrders();await loadLiveData();toast('Order cancelled; stock restored.');go(ME.r==='buyer'?'orders':'ord','keep')}catch(e){toast(e.message)}}
async function liveReceived(id){try{await api(`/api/orders/${encodeURIComponent(id)}/received`,{method:'POST',body:'{}'});await refreshLiveOrders();toast('Delivery confirmation saved.');go('orders','keep')}catch(e){toast(e.message)}}
async function liveCashPaid(id){try{await api(`/api/orders/${encodeURIComponent(id)}/cash-paid`,{method:'POST',body:'{}'});await refreshLiveOrders();toast('Cash payment confirmation saved.');go('orders','keep')}catch(e){toast(e.message)}}
/* Checkout now submits to the API; the server calculates prices and reserves stock. */
async function confirmOrder(){
 if(LOCK)return; const v=chk([['cf_m',mob],['cf_l',x=>x.length>=8?'':'Enter the delivery location']]); if(!v)return;
 const e=chkL(CK.lines); if(e)return toast(e);
 CK.addr={...CK.addr,m:v.cf_m,loc:v.cf_l}; const a=CK.addr;
 LOCK=1; const b=$('cfB'); if(b){b.disabled=true;b.textContent='Placing order…'}
 try{
  const items=CK.lines.map(l=>({productId:Number(l.pid),qty:l.q,unit:PD(l.pid).u}));
  const result=await api('/api/orders/cod',{method:'POST',body:JSON.stringify({confirm:true,items,address:{name:a.n,mobile:a.m,address:a.a+(a.i?' · '+a.i:''),city:a.c,pin:a.p}})});
  if(CK.cart)CK.lines.forEach(l=>delete C[l.pid]); CK={}; C= C||{}; cartN(); await loadLiveData(); await refreshLiveOrders(); toast('Order placed successfully: '+result.orderIds.map(id=>'#'+id).join(', ')); go('orders','keep');
 }catch(err){toast(err.message)}finally{LOCK=0;if(b){b.disabled=false;b.textContent='Confirm Order'}}
}
/* Real backend payment-proof flow. This records a session first; it never marks an order paid automatically. */
async function placeOn(){
 if(LOCK)return; const e=chkL(CK.lines);if(e)return toast(e);
 try{const a=CK.addr;const items=CK.lines.map(l=>({productId:Number(l.pid),qty:l.q,unit:PD(l.pid).u}));const r=await api('/api/payments/sessions',{method:'POST',body:JSON.stringify({items,address:{name:a.n,mobile:a.m,address:a.a+(a.i?' · '+a.i:''),city:a.c,pin:a.p}})});LIVE_SESSION=r.sessionId;PSN={amt:r.amount,step:1,sessionId:r.sessionId};V.pid=null;go('pay');}catch(err){toast(err.message)}
}
async function psSub(){
 if(LOCK||!PSN||!LIVE_SESSION)return toast('Payment session missing. Start checkout again.');
 const r=($('pn_r')?.value||'').trim(), er=$('e_pn_r'), ei=$('e_pn_img');if(er)er.textContent='';if(ei)ei.textContent='';
 if(!refOk(r)){if(er)er.textContent='Enter the 8–22 character UTR / reference';return}
 if(!IMG.pn_img||!/^data:image\/(png|jpe?g|webp);base64,/.test(IMG.pn_img)){if(ei)ei.textContent='Upload a valid payment screenshot';return}
 LOCK=1;const b=$('pnb');if(b)b.disabled=true;
 try{const out=await api(`/api/payments/sessions/${LIVE_SESSION}/proof`,{method:'POST',body:JSON.stringify({utr:r,screenshot:IMG.pn_img})});LIVE_SESSION=null;PSN=null;IMG.pn_img=null;CK={};await loadLiveData();await refreshLiveOrders();toast('Payment proof submitted. Awaiting admin verification; not marked paid.');go('orders','keep')}
 catch(e){toast(e.message)}finally{LOCK=0;if(b)b.disabled=false}
}
async function renderLiveVerification(){
 if(!ME||ME.r!=='admin')return;
 try{const r=await api('/api/admin/payments');LIVE_PAYMENTS=r.payments||[];
 $('app').innerHTML=`<h1>Payment Verification</h1><p class="sm">Verify payment only after checking the actual receiving account. Submitting proof does not mean payment is received.</p>${LIVE_PAYMENTS.map(p=>`<div class="pn"><b>Payment #${p.id} · Order #${p.orderId}</b> ${pill(p.status)}<p>Buyer: ${esc(p.buyer)}<br>Amount: ${money(p.amount)}<br>UTR: ${esc(p.utr)}<br>Submitted: ${fd(p.submittedAt)}</p><p><a href="${p.screenshot}" target="_blank" rel="noopener">View payment screenshot</a></p>${p.status==='verification_pending'?`<div class="btns"><button class="b" onclick="verifyLivePayment(${p.id},true)">Approve payment</button><button class="d" onclick="verifyLivePayment(${p.id},false)">Reject payment</button></div>`:''}</div>`).join('')||'<div class="empty pn">No payment proofs found.</div>'}`;
 }catch(e){toast(e.message)}
}
async function verifyLivePayment(id,approve){try{await api(`/api/admin/payments/${id}/verify`,{method:'POST',body:JSON.stringify({approve})});toast(approve?'Payment approved.':'Payment rejected.');await refreshLiveOrders();await renderLiveVerification()}catch(e){toast(e.message)}}
/* Product changes are persisted through the owner API. */
async function pst(id,status){try{const p=PD(id);const apiStatus=status==='Active'?'Active':'Disabled';await api(`/api/products/${Number(id)}`,{method:'PATCH',body:JSON.stringify({status:apiStatus})});await loadLiveData();toast(p.n+': '+(apiStatus==='Active'?'Active':'Disabled'));go('hist','keep')}catch(e){toast(e.message)}}
async function saveE(){const p=PD(V.edit);const v=chk([['e_p',pos],['e_s',isL(p)?qty0:int0],['e_a',rq]]);if(!v)return;try{await api(`/api/products/${Number(p.id)}`,{method:'PATCH',body:JSON.stringify({price:+v.e_p,stock:+v.e_s,status:v.e_a==='Inactive'?'Disabled':'Active'})});await loadLiveData();toast('Price, stock and status saved to database. Name, description, image and location edits are not supported by this API yet.');go('hist','keep')}catch(e){toast(e.message)}}
/* Restore the real backend session on reload. */
dl();
(async()=>{try{const r=await api('/api/me');await enterApp(r.user)}catch(e){}})();
